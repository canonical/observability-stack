#
# Canonical K8s substrate for the Terraform product integration tests. To
# provision a machine by hand:
#
#   sudo -E concierge prepare -c concierge-k8s.yaml
#
# `-E` matters: concierge expands $DOCKERHUB_MIRROR itself. It is only set on
# IS-hosted runners; elsewhere the URL is empty and the mirror is skipped.
juju:
  extra-bootstrap-args: --config bootstrap-timeout=1800 --config model-logs-size=10G
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG

providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.32-classic/stable
    image-registry:
      url: $DOCKERHUB_MIRROR
    features:
      network: {}
      local-storage: {}
      load-balancer:
        l2-mode: "true"
        # Arbitrary unrouted range, as in concierge's own k8s preset: traffic to
        # a LoadBalancer address is redirected by the service datapath before it
        # is ever routed, so this never needs to be reachable on the wire.
        cidrs: "10.43.45.0/28"
