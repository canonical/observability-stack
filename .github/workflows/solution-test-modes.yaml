name: Solution test modes

# Runs cos-lite's solution tests across every (mode, juju-channel)
# combination, in parallel, on PRs that touch the relevant files.

on:
  pull_request:
    paths:
      - 'tests/solution/cos-lite/**'
      - 'tests/solution/conftest.py'
      - 'tests/solution/helpers.py'
      - 'tests/solution/features/**'
      - 'tests/solution/steps/**'
      - 'terraform/cos-lite/**'
      - 'solution.just'
      - '.github/workflows/solution-test-modes.yaml'
      - '.github/workflows/_solution-test-modes.yaml'

jobs:
  cos-lite:
    name: cos-lite
    uses: ./.github/workflows/_solution-test-modes.yaml
    with:
      solution: cos-lite
      modes: '["tls-internal", "tls-none"]'
      juju-channels: '["3.6/stable", "4.1/beta"]'
