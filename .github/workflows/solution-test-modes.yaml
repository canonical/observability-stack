name: Solution test modes

# Runs cos-lite's solution tests across every combination of the TLS axis,
# the ingress axis, and the Juju channel, in parallel, on PRs that touch the
# relevant files -- the same coverage as PR #502 (2 TLS values x 2 ingress
# values x 2 Juju channels = 8 jobs), just expressed as an explicit
# `combinations` list crossed with `juju-channels` instead of two separate
# matrix dimensions crossed automatically. See SPIKE_modes.md's "Note on
# combinatorics" for why a curated list (rather than every axis crossed
# automatically) matters once more axes (mesh, upgrade) are added.

on:
  pull_request:
    paths:
      - 'tests/solution/cos-lite/**'
      - 'tests/solution/conftest.py'
      - 'tests/solution/helpers.py'
      - 'tests/solution/steps/**'
      - 'terraform/cos-lite/**'
      - 'solution.just'
      - '.github/workflows/solution-test-modes.yaml'
      - '.github/workflows/_solution-test-modes.yaml'

jobs:
  cos-lite:
    name: cos-lite
    uses: ./.github/workflows/_solution-test-modes.yaml
    with:
      solution: cos-lite
      combinations: |
        [
          {"mode": "tls_internal", "ingress": ""},
          {"mode": "tls_internal", "ingress": "no_ingress"},
          {"mode": "tls_none", "ingress": ""},
          {"mode": "tls_none", "ingress": "no_ingress"}
        ]
      juju-channels: '["3.6/stable", "4.1/beta"]'
