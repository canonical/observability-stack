name: Solution test modes

# Runs cos-lite's solution tests across the TLS and ingress axes, in
# parallel, on PRs that touch the relevant files. Not a full cross product
# of both (that's 4 combinations here) -- just enough to exercise the new
# ingress axis once, plus the two TLS values that already existed. See
# SPIKE_modes.md's "Note on combinatorics".

on:
  pull_request:
    paths:
      - 'tests/solution/cos-lite/**'
      - 'tests/solution/conftest.py'
      - 'tests/solution/helpers.py'
      - 'tests/solution/steps/**'
      - 'terraform/cos-lite/**'
      - 'solution.just'
      - '.github/workflows/solution-test-modes.yaml'
      - '.github/workflows/_solution-test-modes.yaml'

jobs:
  cos-lite:
    name: cos-lite
    uses: ./.github/workflows/_solution-test-modes.yaml
    with:
      solution: cos-lite
      combinations: |
        [
          {"mode": "tls_internal", "ingress": ""},
          {"mode": "tls_none", "ingress": ""},
          {"mode": "tls_internal", "ingress": "no_ingress"}
        ]
