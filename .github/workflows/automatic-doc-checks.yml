#
name: Automatic doc checks

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'docs/**'   # Only run on changes to the docs directory

  workflow_dispatch:
    # Manual trigger


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-checks:
    uses: canonical/documentation-workflows/.github/workflows/documentation-checks.yaml@main
    with:
      working-directory: "docs"
      fetch-depth: 0

  removed-urls:
    name: Removed URLs
    if: github.event_name == 'pull_request'
    uses: canonical/sphinx-stack/.github/workflows/check-removed-urls.yml@2.0

  lint-doc-refs:
    name: Versioned docs links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo snap install just --classic
      - name: Check for versioned docs links
        run: just lint-doc-refs