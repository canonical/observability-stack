name: Test and promote a branch's solutions

# Reusable workflow: discovers every solution defined under tests/solution/
# on a single branch, deploys and tests each one, and — only if all of them
# pass — promotes every charm pinned by that branch's Terraform modules from
# /beta to /candidate.
#
# Called once per supported branch/track from quality-gates-candidate.yaml, so adding
# a new track only requires adding an entry to that workflow's branch
# matrix, and adding a new solution only requires adding a directory under
# tests/solution/ (each branch discovers its own set of solutions, so older
# branches without a newer solution are unaffected).

on:
  workflow_call:
    inputs:
      branch:
        description: 'The branch/track to check out and test (e.g. "main", "track/3.0").'
        required: true
        type: string
    secrets:
      CHARMHUB_TOKEN:
        required: true

jobs:
  discover-solutions:
    name: Discover solutions
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.discover.outputs.solutions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: List solutions with a Terraform wrapper module
        id: discover
        run: |
          solutions=$(find tests/solution -mindepth 2 -maxdepth 2 -type d -name terraform -printf '%P\n' | sed 's|/terraform$||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "solutions=$solutions" >> "$GITHUB_OUTPUT"

  test-solutions:
    name: Test ${{ matrix.solution }} (internal-tls=${{ matrix.internal-tls }}, external-ca=${{ matrix.external-ca }}, ingress=${{ matrix.ingress }}, juju=${{ matrix.juju-channel }})
    needs: [discover-solutions]
    strategy:
      fail-fast: false
      matrix:
        solution: ${{ fromJson(needs.discover-solutions.outputs.solutions) }}
        internal-tls: ["true", "false"]
        external-ca: ["true", "false"]
        ingress: ["true", "false"]
        juju-channel: ["3.6/stable"]
        exclude:
          - external-ca: "true"
            ingress: "false"
    # cos deploys the full stack (plus object storage), so it gets the bigger
    # runner; cos-lite gets the same size as its Terraform integration test
    # (see .github/workflows/terraform.yml).
    runs-on: ${{ matrix.solution == 'cos' && 'self-hosted-linux-amd64-noble-xlarge' || 'self-hosted-linux-amd64-noble-large' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # https://documentation.ubuntu.com/self-hosted-runners/en/latest/usage/faq/how-to-setup-canonical-k8s/
      - name: Remove docker.io and containerd
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          sudo apt-get remove -y docker.io containerd
          sudo rm -rf /run/containerd

      # Removing dockerd leaves `iptables -P FORWARD DROP` behind, which
      # blackholes all pod egress. MicroK8s used to reset this; CK8s does not.
      - name: Allow forwarded traffic
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT || true

      - name: Install dependencies
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare -p k8s --juju-channel ${{ matrix.juju-channel }} --extra-snaps just,astral-uv,terraform
          # Configure Cilium for Istio ambient service mesh compatibility
          sudo k8s kubectl patch configmap cilium-config -n kube-system --type merge -p '{"data":{"bpf-lb-sock-hostns-only":"true"}}'
          sudo k8s kubectl rollout restart daemonset/cilium -n kube-system
          sudo k8s kubectl rollout status daemonset/cilium -n kube-system --timeout=90s

      - name: Run solution tests
        run: just solution test ${{ matrix.solution }} ${{ matrix.internal-tls }} ${{ matrix.external-ca }} ${{ matrix.ingress }}

      # TODO: remove before merging -- temporary, to find out from CI runs why
      # some log and trace checks fail (pod logs are lost with the runner).
      - name: Collect debug state
        if: ${{ always() }}
        continue-on-error: true
        run: |
          # Keep going past failed commands (GitHub runs this with bash -e).
          set +e
          k() { sudo k8s kubectl "$@"; }
          cat > /tmp/tracing_buffer.py <<'EOF'
          import glob, sqlite3
          for path in glob.glob("/var/lib/juju/agents/unit-*/charm/.tracing-data.db"):
              db = sqlite3.connect(path)
              settings = dict(db.execute("SELECT key, value FROM settings"))
              pending = db.execute("SELECT count(*) FROM tracing").fetchone()[0]
              ca = "set" if settings.get("ca") else "none"
              print(f"{path}: url={settings.get('url', '')!r} ca={ca} pending={pending}")
          EOF
          # Is each CA file the charm wrote also in the trust store Pebble reads?
          cat > /tmp/trust_check.sh <<'EOF'
          bundle=/etc/ssl/certs/ca-certificates.crt
          echo "bundle mtime: $(stat -c %y "$bundle")"
          for f in /usr/local/share/ca-certificates/*.crt /usr/local/share/ca-certificates/*/*.crt; do
            [ -f "$f" ] || continue
            echo "file $f mtime: $(stat -c %y "$f")"
            awk -v name="$f" -v bundle="$bundle" '
              BEGIN { while ((getline line < bundle) > 0) flat = flat (line ~ /-----/ ? "|" : line) }
              /BEGIN CERT/ { body = ""; next }
              /END CERT/ { n++; print name " cert " n ": " (index(flat, body) ? "in trust store" : "NOT in trust store"); next }
              { body = body $0 }
            ' "$f"
          done
          EOF
          apps="alertmanager catalogue grafana loki mimir tempo otelcol traefik prometheus self-signed-certificates"
          for m in $(juju models --format json | jq -r '.models[]."short-name"' | grep -vx controller); do
            d="solution-debug/$m"
            mkdir -p "$d/units" "$d/pods"
            juju status -m "$m" --relations > "$d/status.txt" 2>&1
            juju debug-log -m "$m" --replay --no-tail > "$d/debug-log.txt" 2>&1
            status=$(juju status -m "$m" --format json 2>/dev/null)
            for app in $apps; do
              for u in $(jq -r --arg a "$app" '.applications[$a].units // {} | keys[]' <<<"$status"); do
                juju show-unit -m "$m" "$u" 2>&1 |
                  sed -E 's/((secret|password|access|token|credential)[a-z_-]*: ).*/\1<redacted>/I' > "$d/units/${u/\//-}.yaml"
              done
            done
            k get pods,events -n "$m" -o wide > "$d/pods.txt" 2>&1
            k get pods -n "$m" -o json > "$d/pods.json" 2>&1
            for p in $(k get pods -n "$m" -o jsonpath='{.items[*].metadata.name}'); do
              k logs -n "$m" "$p" --all-containers --prefix --timestamps > "$d/pods/$p.log" 2>&1
              k logs -n "$m" "$p" --all-containers --prefix --timestamps --previous > "$d/pods/$p.previous.log" 2>/dev/null || rm -f "$d/pods/$p.previous.log"
              for c in $(k get pod -n "$m" "$p" -o jsonpath='{.spec.containers[*].name}'); do
                if [ "$c" = charm ]; then
                  k exec -i -n "$m" "$p" -c charm -- python3 - < /tmp/tracing_buffer.py > "$d/pods/$p.tracing-buffer.txt" 2>&1
                else
                  k exec -n "$m" "$p" -c "$c" -- /charm/bin/pebble plan > "$d/pods/$p.$c.plan.yaml" 2>&1
                  k exec -i -n "$m" "$p" -c "$c" -- sh -s < /tmp/trust_check.sh > "$d/pods/$p.$c.trust.txt" 2>&1
                fi
              done
            done
            # Which apps Tempo has traces from and Loki has logs from, asked directly.
            since=$(( $(date +%s) - 86400 ))
            tempo_ip=$(jq -r '.applications.tempo.units // {} | to_entries[0].value.address // empty' <<<"$status")
            if [ -n "$tempo_ip" ]; then
              for tag in resource.juju_application resource.service.name; do
                q="api/v2/search/tag/$tag/values?start=$since&end=$(date +%s)"
                echo "== $tag"
                curl -sfk --max-time 30 "https://$tempo_ip:3200/$q" || curl -sf --max-time 30 "http://$tempo_ip:3200/$q"
                echo
              done > "$d/tempo-tags.txt" 2>&1
            fi
            loki_ip=$(jq -r '.applications.loki.units // {} | to_entries[0].value.address // empty' <<<"$status")
            if [ -n "$loki_ip" ]; then
              q="loki/api/v1/label/juju_application/values?since=24h"
              { curl -sfk --max-time 30 "https://$loki_ip:3100/$q" || curl -sf --max-time 30 "http://$loki_ip:3100/$q"; } > "$d/loki-apps.txt" 2>&1
            fi
            # otelcol's own counters for spans received, sampled, dropped and sent. Its metrics
            # port only listens on localhost, but it remote-writes them to Mimir or Prometheus.
            for backend in "mimir 8080 prometheus/api/v1/query" "prometheus 9090 api/v1/query"; do
              read -r papp pport ppath <<<"$backend"
              pip=$(jq -r --arg a "$papp" '.applications[$a].units // {} | to_entries[0].value.address // empty' <<<"$status")
              [ -n "$pip" ] || continue
              for scheme in https http; do
                curl -sfk --max-time 30 -G "$scheme://$pip:$pport/$ppath" \
                  --data-urlencode 'query={__name__=~"otelcol_(processor_tail_sampling|receiver_accepted_spans|receiver_refused_spans|exporter_sent_spans|exporter_send_failed_spans).*"}' && break
              done > "$d/otelcol-trace-metrics.json" 2>&1
            done
            # The certificate otelcol serves on its trace and log ports (Traefik's backend).
            otelcol_ip=$(jq -r '.applications.otelcol.units // {} | to_entries[0].value.address // empty' <<<"$status")
            if [ -n "$otelcol_ip" ]; then
              for port in 4318 3500; do
                echo "== $otelcol_ip:$port"
                echo | timeout 20 openssl s_client -connect "$otelcol_ip:$port" 2>/dev/null |
                  openssl x509 -noout -subject -issuer -ext subjectAltName
              done > "$d/otelcol-certs.txt" 2>&1
            fi
            # Experiment, after the tests: do these apps' charm traces reach Tempo when otelcol
            # keeps every "workload" trace? (ops tracing names traces after the bare app name,
            # and otelcol only keeps all traces named "<x>-charm".)
            if [ -n "$otelcol_ip" ] && [ -n "$tempo_ip" ]; then
              tempo_count() {  # number of traces from app $1 in Tempo since $2
                for scheme in https http; do
                  curl -sfk --max-time 30 -G "$scheme://$tempo_ip:3200/api/search" \
                    --data-urlencode "q={resource.juju_application=\"$1\"}" \
                    --data-urlencode "start=$2" --data-urlencode "end=$(date +%s)" \
                    --data-urlencode "limit=100" | jq '.traces | length' && return
                done
              }
              poke() {  # run update-status 5 times on one unit of each app
                for app in loki mimir grafana alertmanager; do
                  u=$(jq -r --arg a "$app" '.applications[$a].units // {} | keys[0] // empty' <<<"$status")
                  [ -n "$u" ] || continue
                  for _ in 1 2 3 4 5; do
                    juju exec -m "$m" --unit "$u" -- 'JUJU_DISPATCH_PATH=hooks/update-status ./dispatch' > /dev/null 2>&1
                  done
                done
              }
              {
                echo "otelcol tracing_sampling_rate_workload=$(juju config -m "$m" otelcol tracing_sampling_rate_workload)"
                t0=$(date +%s); poke; sleep 120
                for app in loki mimir grafana alertmanager; do echo "before: $app $(tempo_count "$app" "$t0")"; done
                juju config -m "$m" otelcol tracing_sampling_rate_workload=100
                sleep 180
                t1=$(date +%s); poke; sleep 120
                for app in loki mimir grafana alertmanager; do echo "after: $app $(tempo_count "$app" "$t1")"; done
              } > "$d/sampling-experiment.txt" 2>&1
            fi
            # The certificate Traefik serves on otelcol's log and trace ports, and its routes.
            host=$(jq -r '.applications.traefik["application-status"].message // empty' <<<"$status" | grep -oE '[^/ ]+$')
            if [ -n "$host" ]; then
              for port in 3500 4318; do
                echo "== $host:$port"
                echo | timeout 20 openssl s_client -connect "$host:$port" 2>/dev/null |
                  openssl x509 -noout -subject -issuer -ext subjectAltName
              done > "$d/traefik-certs.txt" 2>&1
              # shellcheck disable=SC2016 # $f must expand inside the container
              k exec -n "$m" traefik-0 -c traefik -- sh -c 'for f in /opt/traefik/juju/*.yaml; do echo "== $f"; cat "$f"; done' > "$d/traefik-config.txt" 2>&1
            fi
          done

      # TODO: remove before merging -- goes with "Collect debug state" above.
      - name: Upload debug state
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: solution-debug-${{ matrix.solution }}-${{ matrix.internal-tls }}-${{ matrix.external-ca }}-${{ matrix.ingress }}
          path: solution-debug
          retention-days: 14

  promote:
    name: Promote ${{ matrix.solution }}
    needs: [discover-solutions, test-solutions]
    # TODO: remove before merging -- never auto-promote from a pull_request-triggered run
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        solution: ${{ fromJson(needs.discover-solutions.outputs.solutions) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install dependencies
        run: |
          sudo snap install terraform --classic
          sudo snap install just --classic
          sudo snap install charmcraft --classic

      - name: Promote
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: just solution promote ${{ matrix.solution }} ${{ inputs.branch }}
