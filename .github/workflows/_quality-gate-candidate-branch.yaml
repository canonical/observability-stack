name: Test and promote a branch's solutions

# Reusable workflow: discovers every solution defined under tests/solution/
# on a single branch, records what is in each charm's <track>/beta, deploys
# and tests each solution from beta, and — only if all of them pass and beta
# hasn't changed since — promotes every charm pinned by that branch's
# Terraform modules from /beta to /candidate.
#
# Called once per supported branch/track from quality-gates-candidate.yaml, so adding
# a new track only requires adding an entry to that workflow's branch
# matrix, and adding a new solution only requires adding a directory under
# tests/solution/ (each branch discovers its own set of solutions, so older
# branches without a newer solution are unaffected).
#
# Every job uses the branch commit that discover-solutions saw, so a merge
# during the run can't mix commits. The tests run from that commit's checkout.
# The snapshot and promote recipes run from this workflow's own commit and read
# that branch commit's Terraform through git, so the promotion logic lives in
# one place.

on:
  workflow_call:
    inputs:
      branch:
        description: 'The branch/track to check out and test (e.g. "main", "track/3.0").'
        required: true
        type: string
      dry_run:
        description: "Print what would be promoted instead of promoting."
        required: false
        type: boolean
        default: true
    secrets:
      CHARMHUB_TOKEN:
        required: true

jobs:
  discover-solutions:
    name: Discover solutions
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.discover.outputs.solutions }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Record the branch commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: List solutions with a Terraform wrapper module
        id: discover
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -d tests/solution ]; then
            solutions=$(find tests/solution -mindepth 2 -maxdepth 2 -type d -name terraform -printf '%P\n' | sed 's|/terraform$||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            solutions='[]'
          fi
          if [ "$solutions" = "[]" ]; then
            echo "::warning::No solution tests on ${BRANCH}; nothing tested or promoted for it."
          fi
          echo "solutions=$solutions" >> "$GITHUB_OUTPUT"

  snapshot:
    name: Snapshot beta
    needs: [discover-solutions]
    if: ${{ needs.discover-solutions.outputs.solutions != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    env:
      BRANCH: ${{ inputs.branch }}
      SHA: ${{ needs.discover-solutions.outputs.sha }}
      MODULES: ${{ join(fromJson(needs.discover-solutions.outputs.solutions), ' ') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the branch commit's Terraform
        run: git fetch --no-tags --depth=1 origin "$SHA"

      - name: Install dependencies
        run: sudo snap install just --classic

      # Fails if any charm has nothing in <track>/beta, before any runner is spent on tests.
      - name: Record the beta revisions
        run: |
          # shellcheck disable=SC2086 # MODULES is a space-separated list
          just solution snapshot "$SHA" beta $MODULES > snapshot.json
          cat snapshot.json

      - name: Name the artifact
        id: name
        run: echo "artifact=candidate-gate-snapshot-${BRANCH//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload the snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: snapshot.json
          # "Re-run all jobs" takes a new snapshot under the same name.
          overwrite: true

  test-solutions:
    name: Test ${{ matrix.solution }} (internal-tls=${{ matrix.internal-tls }}, external-ca=${{ matrix.external-ca }}, ingress=${{ matrix.ingress }}, juju=${{ matrix.juju-channel }})
    needs: [discover-solutions, snapshot]
    strategy:
      fail-fast: false
      matrix:
        solution: ${{ fromJson(needs.discover-solutions.outputs.solutions) }}
        internal-tls: ["true", "false"]
        external-ca: ["true", "false"]
        ingress: ["true", "false"]
        juju-channel: ["3.6/stable"]
        exclude:
          - external-ca: "true"
            ingress: "false"
    # cos deploys the full stack (plus object storage), so it gets the bigger
    # runner; cos-lite gets the same size as its Terraform integration test
    # (see .github/workflows/terraform.yml).
    runs-on: ${{ matrix.solution == 'cos' && 'self-hosted-linux-amd64-noble-xlarge' || 'self-hosted-linux-amd64-noble-large' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover-solutions.outputs.sha }}

      # https://documentation.ubuntu.com/self-hosted-runners/en/latest/usage/faq/how-to-setup-canonical-k8s/
      - name: Remove docker.io and containerd
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          sudo apt-get remove -y docker.io containerd
          sudo rm -rf /run/containerd

      # Removing dockerd leaves `iptables -P FORWARD DROP` behind, which
      # blackholes all pod egress. MicroK8s used to reset this; CK8s does not.
      - name: Allow forwarded traffic
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT || true

      - name: Install dependencies
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare -p k8s --juju-channel ${{ matrix.juju-channel }} --extra-snaps just,astral-uv,terraform
          # Configure Cilium for Istio ambient service mesh compatibility
          sudo k8s kubectl patch configmap cilium-config -n kube-system --type merge -p '{"data":{"bpf-lb-sock-hostns-only":"true"}}'
          sudo k8s kubectl rollout restart daemonset/cilium -n kube-system
          sudo k8s kubectl rollout status daemonset/cilium -n kube-system --timeout=90s

      # Deploy from beta: that's what the promote job moves to candidate.
      - name: Run solution tests
        run: just solution test ${{ matrix.solution }} ${{ matrix.internal-tls }} ${{ matrix.external-ca }} ${{ matrix.ingress }} beta

  promote:
    name: Promote to candidate${{ inputs.dry_run && ' (dry run)' || '' }}
    needs: [discover-solutions, snapshot, test-solutions]
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch }}
      SHA: ${{ needs.discover-solutions.outputs.sha }}
      DRY_RUN: ${{ inputs.dry_run }}
      MODULES: ${{ join(fromJson(needs.discover-solutions.outputs.solutions), ' ') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the branch commit's Terraform
        run: git fetch --no-tags --depth=1 origin "$SHA"

      - name: Download the snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.snapshot.outputs.artifact }}

      - name: Install dependencies
        run: |
          sudo snap install just --classic
          if [ "$DRY_RUN" = "false" ]; then sudo snap install charmcraft --classic; fi

      - name: Promote
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          # A manual run can test any branch, but only main and track/* may promote.
          case "$BRANCH" in
            main|track/*) ;;
            *)
              if [ "$DRY_RUN" = "false" ]; then
                echo "ERROR: ${BRANCH} isn't main or track/*, so it can only be a dry run; nothing promoted." >&2
                exit 1
              fi
              ;;
          esac
          echo "Branch \`${BRANCH}\` at \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086 # MODULES is a space-separated list
          just solution promote-to-candidate "$SHA" snapshot.json "$DRY_RUN" $MODULES
