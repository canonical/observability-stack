name: Test the Terraform product module
run-name: Deploy ${{ inputs.product }} on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'The name of the Terraform product module to test.'
        required: true
        type: choice
        default: cos
        options:
        - cos
        - cos_lite
        - cos_dev
      runner:
        description: 'The runner label to use for the job.'
        type: choice
        default: ubuntu-latest
        options:
        - ubuntu-latest
        - self-hosted-linux-amd64-noble-large
        - self-hosted-linux-amd64-noble-xlarge
        - self-hosted-linux-amd64-noble-2xlarge
      debug-ssh:
        description: 'Open an SSH session once the substrate is provisioned, before the product tests run.'
        type: boolean
        default: false
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      runner:
        type: string
        default: ubuntu-latest
      debug-ssh:
        type: boolean
        default: false

jobs:
  terraform-test:
    name: Test product module
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        juju-channel: ["3.6/stable"]
        scenario: ["tls_none"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Substrate setup ---
      # Canonical K8s ships and manages its own containerd. On IS-hosted runners
      # the pre-installed docker.io/containerd packages conflict with it, so they
      # are removed before bootstrapping.
      # https://documentation.ubuntu.com/self-hosted-runners/en/latest/usage/faq/how-to-setup-canonical-k8s/
      - name: Remove docker.io and containerd
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get remove -y docker.io containerd
          sudo rm -rf /run/containerd

      - name: Concierge prepare
        timeout-minutes: 30
        run: |
          # MetalLB needs an address range it can answer ARP for. The node's own
          # address is what the previous MicroK8s setup used and is reachable
          # from the runner, which is all the tests require.
          IPADDR=$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc')

          # CoreDNS forwards to the node's /etc/resolv.conf unless told otherwise,
          # but on Ubuntu that is the systemd-resolved stub (127.0.0.53). Inside
          # the CoreDNS pod that address is the pod's own loopback, where nothing
          # is listening, so every external lookup returns SERVFAIL and Juju fails
          # to reach api.charmhub.io. MicroK8s' dns addon probed the host's real
          # resolvers for us; Canonical K8s does not, so pass them explicitly.
          # The real upstreams live in /run/systemd/resolve/resolv.conf, not in
          # /etc/resolv.conf.
          DNS_SOURCES=""
          for f in /run/systemd/resolve/resolv.conf /etc/resolv.conf; do
            [ -r "$f" ] && DNS_SOURCES="$DNS_SOURCES $f"
          done
          # shellcheck disable=SC2086
          UPSTREAM_DNS=$(awk '/^nameserver/ && $2 !~ /^127\./ {print $2}' $DNS_SOURCES \
            | awk '!seen[$0]++' | paste -sd,)
          if [ -z "$UPSTREAM_DNS" ]; then
            echo "::error::Could not determine the node's upstream nameservers from:$DNS_SOURCES"
            exit 1
          fi
          echo "CoreDNS will forward to: $UPSTREAM_DNS"

          # Canonical K8s still pulls workload images through containerd, so the
          # IS-hosted Docker Hub mirror is as necessary as it was for MicroK8s;
          # only the config location changes. Concierge writes it to
          # /etc/containerd/hosts.d/docker.io/hosts.toml *before* bootstrapping,
          # so even the bootstrap images come from the mirror.
          # DOCKERHUB_MIRROR is unset on GitHub-hosted runners, in which case
          # concierge sees an empty URL and skips the mirror entirely.
          cat > /tmp/concierge.yaml << EOF
          juju:
            # The default 20-minute bootstrap timeout is too short for the
            # controller pod to expose its API on busy CI runners.
            extra-bootstrap-args: --config bootstrap-timeout=1800 --config model-logs-size=10G
            model-defaults:
              logging-config: '<root>=INFO; unit=DEBUG'
          providers:
            k8s:
              enable: true
              bootstrap: true
              channel: 1.34-classic/stable
              image-registry:
                url: "${DOCKERHUB_MIRROR:-}"
              features:
                network: {}
                local-storage: {}
                dns:
                  upstream-nameservers: "${UPSTREAM_DNS}"
                load-balancer:
                  l2-mode: "true"
                  cidrs: "${IPADDR}/32"
          EOF
          cat /tmp/concierge.yaml

          sudo snap install concierge --classic
          sudo concierge prepare \
            --config /tmp/concierge.yaml \
            --juju-channel ${{ matrix.juju-channel }} \
            --extra-snaps just,astral-uv,terraform

      # Fail fast and unambiguously if pods cannot resolve external names. Without
      # this the symptom only surfaces minutes later, as an opaque Terraform error
      # from every charm at once.
      - name: Verify in-cluster DNS resolves external names
        timeout-minutes: 5
        run: |
          kubectl -n kube-system rollout status deployment/coredns --timeout=3m

          kubectl run dns-check --restart=Never --image=busybox:1.36 \
            --command -- sh -c 'nslookup api.charmhub.io'
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/dns-check --timeout=2m || true

          echo "--- dns-check output ---"
          kubectl logs dns-check || true
          phase=$(kubectl get pod dns-check -o jsonpath='{.status.phase}' 2>/dev/null || echo Unknown)
          kubectl delete pod dns-check --now --ignore-not-found

          if [ "$phase" != "Succeeded" ]; then
            echo "::error::Pods cannot resolve external names (dns-check phase=$phase). Check dns.upstream-nameservers."
            exit 1
          fi

      - name: Install and configure microceph
        if: ${{ inputs.product == 'cos' }}
        run: |
          # https://github.com/canonical/microceph-action/blob/main/microceph.sh
          function check_ceph_ok_or_exit () {
              i=0
              for i in {1..5}; do
                  if sudo microceph.ceph status | grep HEALTH_OK; then
                      break
                  else
                      sudo microceph.ceph status
                      sleep 30
                      sudo microceph.ceph health detail
                  fi
              done
              if [ "$i" -eq 5 ]; then
                  exit 1
              fi
          }

          sudo snap install microceph
          sudo microceph cluster bootstrap
          sleep 30s
          sudo microceph.ceph config set "mon.$(hostname)" mon_data_avail_warn 6
          sudo microceph disk add loop,2G,3
          check_ceph_ok_or_exit

          sudo microceph enable rgw --port 8080 --ssl-port 8443
          sudo microceph.radosgw-admin user create --uid=user --display-name=User
          sudo microceph.radosgw-admin key create --uid=user --key-type=s3 --access-key=access-key --secret-key=secret-key

      - name: Report substrate state
        run: |
          sudo k8s status
          kubectl get nodes -o wide
          kubectl get pods --all-namespaces
          juju controllers
          juju clouds --client

      # Provisioning is complete but no product has been deployed yet, so this is
      # the cheapest point at which to inspect a freshly built substrate.
      - name: Open SSH session before the product tests
        if: ${{ inputs.debug-ssh || runner.debug == '1' }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true

      - name: Test deployment
        run: |
          if [[ "${{ inputs.product }}" == "cos" ]]; then
            S3_ENDPOINT=http://$(ip -4 -j route get 2.2.2.2 | jq -r '.[] | .prefsrc'):8080
            export S3_ENDPOINT
            export S3_ACCESS_KEY=access-key
            export S3_SECRET_KEY=secret-key
          fi
          if [[ "${{ runner.debug }}" == "1" ]]; then
            export KEEP_MODELS=true
            just integration ${{ inputs.product }}/${{ matrix.scenario }} --keep-models
          else
            just integration ${{ inputs.product }}/${{ matrix.scenario }}
          fi

      - name: Open SSH session on failure
        if: ${{ failure() && (runner.debug == '1') }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true
